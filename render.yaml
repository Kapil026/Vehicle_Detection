services:
  - type: web
    name: vehicle-detection-api
    env: python
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python download_model.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: MAX_CONTENT_LENGTH
        value: 104857600
      - key: CONFIDENCE_THRESHOLD
        value: 0.5
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "https://vehicle-detection-ejuf.onrender.com"
      - key: PYTHONUNBUFFERED
        value: "true"
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: vehicle-detection-data
      mountPath: /data
      sizeGB: 10