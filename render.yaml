services:
  - type: web
    name: vehicle-detection-api
    env: python
    region: oregon
    buildCommand: |
      # Create directories
      mkdir -p /tmp/Ultralytics
      mkdir -p .cache/pip
      
      # Use pip cache
      export PIP_CACHE_DIR=.cache/pip
      
      # Install dependencies with caching
      if [ -f requirements.lock ]; then
        pip install --cache-dir .cache/pip -r requirements.lock
      else
        pip install --cache-dir .cache/pip -r requirements.txt
      fi
      
      # Download model if not in cache
      if [ ! -f .cache/models/yolov8n.pt ]; then
        mkdir -p .cache/models
        python download_model.py
        cp yolov8n.pt .cache/models/
      else
        cp .cache/models/yolov8n.pt .
      fi
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: MAX_CONTENT_LENGTH
        value: 104857600
      - key: CONFIDENCE_THRESHOLD
        value: 0.5
      - key: SECRET_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: YOLO_CONFIG_DIR
        value: "/tmp/Ultralytics"
      - key: PIP_CACHE_DIR
        value: ".cache/pip"
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: vehicle-detection-data
      mountPath: /data
      sizeGB: 10
    cache:
      - name: pip-cache
        path: .cache/pip
        ttl: 168h # 1 week
      - name: model-cache
        path: .cache/models
        ttl: 720h # 30 days